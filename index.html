<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoraBox — Home Preview</title>
<style>
:root{color-scheme:dark;--bg:#07101d;--surface:#0d1a2b;--line:#1c2a3e;--muted:#8791a3;--text:#f2f6fc;--cyan:#5ec8ff;--violet:#b79bf7;--green:#28c281}
*{box-sizing:border-box}body{margin:0;background:#020711;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}.phone{width:min(390px,100%);min-height:780px;border:1px solid #324257;border-radius:34px;background:var(--bg);box-shadow:0 24px 80px #000b;padding:28px 18px 18px;display:flex;flex-direction:column;gap:18px}.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.logo{width:34px;height:34px;border:2px solid var(--cyan);border-radius:11px;display:grid;place-items:center;color:var(--cyan);font-weight:800}.title{font-size:23px;font-weight:750;letter-spacing:-.4px}.more{font-size:24px;color:#c7d0df}.status{display:flex;align-items:center;justify-content:space-between;padding:18px 16px;border:1px solid #167cae;border-radius:19px;background:linear-gradient(135deg,#0d2335,#0b192a)}.status-left{display:flex;align-items:center;gap:12px}.check{width:32px;height:32px;border-radius:50%;background:#159b67;display:grid;place-items:center;font-weight:800}.connected{font-size:21px;color:var(--cyan);font-weight:750}.sub{color:var(--muted);font-size:12px;margin-top:3px}.switch{width:58px;height:32px;background:#20bcec;border-radius:18px;padding:3px}.knob{height:26px;width:26px;background:#fff;border-radius:50%;margin-left:26px}.profile{padding:16px 8px 14px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--muted);font-size:12px;margin-bottom:10px}.profile-row{display:flex;align-items:center;gap:12px}.flag{width:40px;height:40px;border-radius:50%;background:linear-gradient(#ed3e45 50%,#f3f5f8 50%);display:grid;place-items:center;font-size:16px}.profile-name{font-size:18px;font-weight:700}.chip{display:inline-block;margin-top:6px;padding:3px 9px;border-radius:10px;background:#33266a;color:#dfd2ff;font-size:11px}.arrow{margin-left:auto;font-size:25px;color:#e0e7f0}.metrics{padding:4px 0}.metric-row{display:grid;grid-template-columns:1fr 1fr;padding:15px 4px;border-bottom:1px solid var(--line)}.metric{display:flex;align-items:center;gap:10px;min-width:0}.metric+ .metric{border-left:1px solid var(--line);padding-left:22px}.metric-icon{font-size:25px;color:var(--cyan)}.metric:nth-child(2) .metric-icon{color:var(--violet)}.metric-label{display:block;color:var(--muted);font-size:12px}.value{font-size:18px;font-weight:750;color:var(--cyan);white-space:nowrap}.metric:nth-child(2) .value{color:var(--violet)}.unit{font-size:11px;color:#aab5c4;font-weight:500}.traffic-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.legend{display:flex;gap:12px;font-size:11px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}.down{background:var(--cyan)}.up{background:var(--violet)}svg{width:100%;height:74px}.nav{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-around}.nav-item{text-align:center;color:#5b6478;font-size:10.5px}.nav-item.active{color:var(--cyan)}.nav-icon{font-size:20px;display:block;margin-bottom:4px}
</style>
</head>
<body>
<main class="phone" aria-label="SoraBox Home preview">
  <header class="top"><div class="brand"><div class="logo">S</div><div class="title">SoraBox</div></div><div class="more">⋮</div></header>
  <section class="status"><div class="status-left"><div class="check">✓</div><div><div class="connected">Connected</div><div class="sub">Your connection is secure.</div></div></div><div class="switch"><div class="knob"></div></div></section>
  <section class="profile"><div class="eyebrow">Current Profile</div><div class="profile-row"><div class="flag">✦</div><div><div class="profile-name">Singapore · Reality</div><span class="chip">✦ Reality</span></div><div class="arrow">›</div></div></section>
  <section class="metrics">
    <div class="metric-row"><div class="metric"><span class="metric-icon">↓</span><div><span class="metric-label">Download</span><span class="value">18.64 <span class="unit">Mbps</span></span></div></div><div class="metric"><span class="metric-icon">↑</span><div><span class="metric-label">Upload</span><span class="value">7.21 <span class="unit">Mbps</span></span></div></div></div>
    <div class="metric-row"><div class="metric"><span class="metric-icon">↙</span><div><span class="metric-label">Inbound</span><span class="value">1.26 <span class="unit">GB</span></span></div></div><div class="metric"><span class="metric-icon">↗</span><div><span class="metric-label">Outbound</span><span class="value">18.65 <span class="unit">GB</span></span></div></div></div>
    <div class="metric-row"><div class="metric"><span class="metric-icon">ϟ</span><div><span class="metric-label">Latency</span><span class="value">42 <span class="unit">ms</span></span></div></div><div class="metric"><span class="metric-icon">◷</span><div><span class="metric-label">Uptime</span><span class="value">00:12:34</span></div></div></div>
  </section>
  <section><div class="traffic-head"><span>Traffic · last 60s</span><div class="legend"><span><span class="dot down"></span>Down</span><span><span class="dot up"></span>Up</span></div></div><svg viewBox="0 0 300 90" role="img" aria-label="Traffic chart"><polygon points="0,60 20,50 40,55 60,30 80,35 100,20 120,40 140,35 160,25 180,38 200,20 220,30 240,15 260,25 280,10 300,20 300,90 0,90" fill="#5ec8ff" opacity=".12"/><polyline points="0,60 20,50 40,55 60,30 80,35 100,20 120,40 140,35 160,25 180,38 200,20 220,30 240,15 260,25 280,10 300,20" fill="none" stroke="#5ec8ff" stroke-width="2"/><polyline points="0,80 20,78 40,75 60,70 80,72 100,68 120,65 140,70 160,60 180,65 200,58 220,62 240,55 260,60 280,58 300,62" fill="none" stroke="#b79bf7" stroke-width="2"/></svg></section>
  <nav class="nav"><div class="nav-item active"><span class="nav-icon">⌂</span>Home</div><div class="nav-item"><span class="nav-icon">☷</span>Profiles</div><div class="nav-item"><span class="nav-icon">⌁</span>Routing</div><div class="nav-item"><span class="nav-icon">⚙</span>Settings</div></nav>
</main>
</body></html>
